<!DOCTYPE html>
<html lang="no" class="scroll-smooth">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Artikler om studiet og studentlivet i Toulouse | NORGINSA</title>
  <meta name="description" content="Artikler fra norske studenter i Toulouse: studenthistorier, tips til studiestart, linjene på INSA Toulouse og de snodigste tradisjonene i byen.">
  <link rel="canonical" href="https://www.norginsa.no/artikler">

  <!-- Open Graph / deling på sosiale medier -->
  <meta property="og:site_name" content="NORGINSA">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://www.norginsa.no/artikler">
  <meta property="og:title" content="Artikler om studiet og studentlivet i Toulouse | NORGINSA">
  <meta property="og:description" content="Artikler fra norske studenter i Toulouse: studenthistorier, tips til studiestart, linjene på INSA Toulouse og de snodigste tradisjonene i byen.">
  <meta property="og:image" content="https://www.norginsa.no/assets/images/mainpage2.jpg">
  <meta property="og:locale" content="nb_NO">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="icon" type="image/x-icon" href="assets/images/icon.ico">

  <!-- Skrift, stil og Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="assets/js/tailwind-oppsett.js"></script>

  <!-- Temaet settes før siden tegnes, så den ikke blinker hvit i mørk modus -->
  <script>
    (function () {
      try {
        var lagret = localStorage.getItem("theme");
        var mork = lagret ? lagret === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
        if (mork) document.documentElement.classList.add("dark");
      } catch (e) {}
    })();
  </script>
  <script src="assets/js/theme.js" defer></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@500;600;700&display=swap">
  <link rel="stylesheet" href="assets/css/site.css">
</head>

<body class="bg-gray-50 text-gray-800 dark:bg-gray-900 dark:text-gray-100">

  <!-- Navbar -->
  <div id="navbar"></div>
  <script src="assets/js/getNavbar.js"></script>
  <script>
    document.getElementById("navbar").innerHTML = getNavbarHTML();
  </script>
  <script src="assets/js/navbar.js"></script>

  <section class="sidetopp max-w-6xl mx-auto px-4 pt-4 pb-2">
    <p class="sidetopp-stikk fade-down-anim" style="animation-delay:.04s">Hjemmelaget i Toulouse!</p>
    <h1 class="fade-down-anim" style="animation-delay:.1s">Artikler</h1>
    <p class="sidetopp-ingress fade-down-anim" style="animation-delay:.18s">
      Alt fra studenthistorier og tradisjoner til kart over campus!
    </p>

    <div class="filterrad">
      <div id="taggfilter" class="taggstripe" role="group" aria-label="Filtrer på tema"></div>
      <label class="sr-only" for="sokefelt">Søk i artiklene</label>
      <input type="search" id="sokefelt" class="sokefelt" placeholder="Søk i artiklene" autocomplete="off">
    </div>

    <p id="artikkel-antall" class="antall" aria-live="polite"></p>
  </section>

  <section class="max-w-6xl mx-auto px-4 pb-16">
    <div id="framhevet" hidden></div>
    <div id="artikkelliste" class="artikkelrutenett"></div>
    <div id="ingen-treff" class="ingen-treff" hidden>
      <p>Fant ingen artikler som passer.</p>
      <p class="mt-3">
        <button type="button" class="knapp knapp-sekundar" data-nullstill>Vis alle</button>
      </p>
    </div>
  </section>

  <div id="footer"></div>
  <script src="assets/js/getFooter.js"></script>
  <script>
    document.getElementById("footer").innerHTML = getFooterHTML();
  </script>

  <script src="assets/js/tagger.js" defer></script>
  <script src="assets/js/artikler.js" defer></script>
</body>

</html>
